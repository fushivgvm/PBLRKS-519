name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

# Least privilege: token hanya boleh membaca isi repo
permissions:
    contents: read

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CI JOB 3: Secret Scanning (Gitleaks)
    # ==========================================
    secret-scan:
        name: Gitleaks Secret Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read   # dibutuhkan Gitleaks untuk membaca commit pada PR
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0   # ambil seluruh riwayat commit

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ==========================================
    # CD STAGE: Deploy ke VM
    # Hanya berjalan setelah merge ke main (bukan saat PR)
    # ==========================================
    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check, secret-scan]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: self-hosted
        env:
            API_KEY: ${{ secrets.API_KEY }}
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build and Run Container
              run: |
                  docker build -t secure-flask-app:latest .
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --restart unless-stopped \
                    -e API_KEY="$API_KEY" \
                    --name web-flask secure-flask-app:latest
                  docker ps | grep web-flask